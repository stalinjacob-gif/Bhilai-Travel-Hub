<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bhilai Travel Hub — Cab & Self-Drive</title>
<style>
:root{--ink:#0f172a;--mut:#475569;--amb:#f59e0b;--amb2:#d97706;--bg:#f8fafc;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(120deg,#fff,#fffbeb,#f8fafc,#fff);background-size:300% 300%;animation:g 18s ease infinite}
.bg i{position:absolute;border-radius:50%;background:#fde68a55;animation:f 14s ease-in-out infinite}
@keyframes g{50%{background-position:100% 50%}}@keyframes f{50%{transform:translateY(-30px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header{position:sticky;top:0;background:#fffe;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10}
.w{max-width:1100px;margin:auto;padding:0 16px}.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;color:var(--ink);text-decoration:none;font-size:1.15rem}.logo b{color:var(--amb2)}
nav{display:flex;gap:4px;align-items:center}nav a{padding:8px 10px;border-radius:8px;color:var(--mut);text-decoration:none;font-weight:600;font-size:.92rem}
nav a:hover{background:#fef3c7}nav a.on{color:var(--ink);background:#fef3c7}
#mb{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:1rem}
@media(max-width:1100px){#mb{display:block}nav{display:none;position:absolute;top:64px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:8px 16px;border-bottom:1px solid var(--line)}nav.open{display:flex}}
main{min-height:70vh;padding:28px 0 48px}h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:.2em 0}h2{margin:1.2em 0 .5em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px #0f172a12;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0f172a1a}
.btn{display:inline-block;background:var(--amb);color:#1c1300;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem}.btn:hover{background:var(--amb2);color:#fff}.btn.alt{background:var(--ink);color:#fff}.btn.sm{padding:7px 12px;font-size:.88rem}
label{display:block;font-weight:600;font-size:.88rem;margin:10px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #fcd34d}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.msg{padding:10px 12px;border-radius:10px;margin:12px 0}.err{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#065f46}.note{background:#fffbeb;color:#92400e}
.tag{font-size:.75rem;font-weight:700;color:var(--amb2);text-transform:uppercase}.sk{height:90px;border-radius:16px;background:linear-gradient(90deg,#eee,#f8f8f8,#eee);background-size:200%;animation:g 1.4s linear infinite}
details{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:#fff}summary{cursor:pointer;font-weight:700}
footer{border-top:1px solid var(--line);background:#fff;padding:24px 0;color:var(--mut);font-size:.9rem}footer a{color:var(--mut);margin-right:14px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}.scroll{overflow-x:auto}
.w{width:min(100%,1140px)}
header{box-shadow:0 6px 24px #0f172a0b}
.bar{gap:20px}
nav a{transition:background .18s,color .18s}
#mb{cursor:pointer}
main{padding-top:32px}
.hero{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.75fr);gap:clamp(28px,6vw,76px);align-items:center;padding:clamp(28px,6vw,72px);border-radius:28px;background:radial-gradient(ellipse at 80% 10%,#fbbf2430,transparent 35%),linear-gradient(130deg,#0f172a,#172554 74%,#1e293b);color:white;box-shadow:0 24px 60px #0f172a24}
.hero:before,.hero:after{content:"";position:absolute;z-index:-1;border:1px solid #ffffff19;border-radius:50%;width:420px;height:420px;right:-110px;top:-210px}
.hero:after{width:310px;height:310px;right:-55px;top:-155px}
.hero-copy{max-width:620px}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #ffffff30;border-radius:999px;background:#ffffff0c;color:#fde68a;font-size:.83rem;font-weight:700;letter-spacing:.04em}
.hero h1{max-width:650px;margin:20px 0 14px;font-size:clamp(2.4rem,5.5vw,4.4rem);line-height:1.04;letter-spacing:-.045em}
.hero h1 b{color:#fbbf24}
.hero-copy>p{max-width:540px;color:#dbe4f0;font-size:1.08rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}
.hero .btn{box-shadow:0 8px 18px #0002}
.hero .btn.alt{background:#ffffff14;border:1px solid #ffffff30}
.trust-row{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:30px;color:#dbe4f0;font-size:.9rem}
.trust-row span{display:flex;align-items:center;gap:7px}
.quick-search{background:#fff;color:var(--ink);padding:24px;border-radius:20px;box-shadow:0 18px 50px #02061740}
.quick-search h2{margin:8px 0 2px;font-size:1.45rem}
.quick-search>p{margin:0 0 12px;color:var(--mut);font-size:.92rem}
.quick-search .btn{width:100%;margin-top:16px}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:52px 0 18px}
.section-heading h2{margin:0;font-size:clamp(1.45rem,3vw,2rem);letter-spacing:-.025em}
.section-heading p{margin:4px 0 0;color:var(--mut)}
.section-heading>a{white-space:nowrap;color:var(--amb2);font-weight:700;text-decoration:none}
.card{border-radius:18px;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{border-color:#fbbf24}
.grid .card h3{margin-top:10px}
.tag{letter-spacing:.07em}
.btn{transition:transform .18s,background .18s,box-shadow .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px #0f172a20}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
input,select,textarea{transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{border-color:#f59e0b;box-shadow:0 0 0 3px #fbbf2433}
.form-shell{max-width:650px;margin:32px auto}
.form-shell>p{color:var(--mut)}
.request-card{padding:clamp(22px,5vw,34px)}
.request-card .btn{margin-top:18px}
.field-note{font-size:.9rem;color:var(--mut)}
.email-actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.email-help{font-size:.92rem;color:var(--mut)}
footer{margin-top:28px}
footer .w>p{margin-bottom:0}
@media(max-width:1100px){
  .bar{height:60px}
  nav{top:60px;box-shadow:0 16px 24px #0f172a15}
  nav a{padding:11px 12px}
  .hero{grid-template-columns:1fr;padding:clamp(24px,6vw,48px)}
  .quick-search{max-width:560px}
}
@media(max-width:560px){
  main{padding-top:18px}
  .hero{gap:26px;border-radius:20px}
  .hero h1{font-size:clamp(2.2rem,12vw,3.3rem)}
  .hero-actions{display:grid}
  .hero-actions .btn{text-align:center}
  .trust-row{display:grid;gap:9px}
  .quick-search{padding:20px}
  .section-heading{align-items:start;flex-direction:column;margin-top:38px}
  .grid{grid-template-columns:1fr}
  footer #fl> a{display:inline-block;margin:4px 10px 4px 0}
}
</style></head><body><div class="bg"><i style="width:220px;height:220px;left:6%;top:12%"></i><i style="width:140px;height:140px;right:8%;top:40%;animation-delay:-5s"></i></div>
<header><div class="w bar"><a class="logo" href="#/">🚕 Bhilai <b>Travel Hub</b></a><button id="mb" type="button" aria-label="Menu" aria-controls="nav" aria-expanded="false">☰</button><nav id="nav" aria-label="Main"></nav></div></header>
<main><div class="w" id="app" aria-live="polite"></div></main>
<footer><div class="w"><div id="fl"></div><p>© 2026 Bhilai Travel Hub · Serving Bhilai, Durg &amp; Raipur.</p></div></footer>
<script>
const $=(s)=>document.querySelector(s),app=$('#app');let CFG={phone:'',email:'',cancellation:{}};
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json','X-Requested-With':'bth'},body:o.body?JSON.stringify(o.body):(o.method&&o.method!=='GET'?'{}':undefined)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{data:d,status:r.status});return d}
const msg=(el,t,c)=>{el.innerHTML=`<div class="msg ${c}" role="${c==='err'?'alert':'status'}">${esc(t)}</div>`};
const NAV=[['/','Home'],['/book','Book Cab'],['/self-drive','Self-Drive Cars'],['/fleet','Our Fleet'],['/routes','Routes & Fares'],['/policy','Cancellation Policy'],['/faq','FAQs'],['/contact','Contact']];
function nav(){const h=location.hash.slice(1)||'/';$('#nav').innerHTML=NAV.map(([p,l])=>`<a href="#${p}" class="${h===p?'on':''}" ${h===p?'aria-current="page"':''}>${l}</a>`).join('');
 $('#fl').innerHTML=NAV.map(([p,l])=>`<a href="#${p}">${l}</a>`).join('')+`<p><a href="tel:${CFG.phone.replace(/\s/g,'')}">📞 ${esc(CFG.phone)}</a>${CFG.email?`<a href="mailto:${esc(CFG.email)}">Email us</a>`:''}</p>`}
$('#mb').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#mb').setAttribute('aria-expanded',o);$('#mb').textContent=o?'×':'☰'};
const sk=()=>'<div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
const CAT={sedan:'Prime Sedan',suv:'SUV (6+1)',mpv:'Innova Crysta MPV'};
const mailtoUrl=(subject,body)=>`mailto:${encodeURIComponent(CFG.email).replace(/%40/gi,'@')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
const gmailDraftUrl=(subject,body)=>`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(CFG.email)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
const openEmailDraft=(el,subject,body)=>{if(!CFG.email){msg(el,'Booking email is not configured. Set BUSINESS_EMAIL in the server environment and restart the app.','err');return}const href=mailtoUrl(subject,body),gmail=gmailDraftUrl(subject,body);el.innerHTML=`<div class="msg ok" role="status"><b>Your email draft is ready.</b><p>Sign in to Gmail if prompted. In the draft, tap <b>Send</b> (near the bottom of the compose window). This website does not send the email automatically.</p><div class="email-actions"><a class="btn sm" href="${esc(gmail)}" target="_blank" rel="noopener noreferrer">Open Gmail draft</a><a class="btn sm alt" href="${esc(href)}">Open device email app</a><button class="btn sm alt" id="copy-email" type="button">Copy details</button></div><label for="email-message">Email details</label><textarea id="email-message" rows="8" readonly>${esc(body)}</textarea></div>`;$('#copy-email').onclick=async()=>{try{await navigator.clipboard.writeText(body);$('#copy-email').textContent='Copied'}catch{$('#email-message').focus();$('#email-message').select();msg(el,'Automatic copy is unavailable. The details are selected so you can copy and paste them into an email.','note')}}};
const veh=(v)=>`<div class="card"><span class="tag">${esc(v.category)}</span><h3>${esc(v.name)}</h3><p>${v.seats} seats${v.transmission?' • '+esc(v.transmission):''}${v.fuel?' • '+esc(v.fuel):''}</p><p>${esc(v.notes||'')}</p><p><b>${v.available?'Available':'Unavailable'}</b> • ${v.daily_rate?'₹'+v.daily_rate+'/day':'Rate on request'}</p>${v.self_drive?`<a class="btn sm" href="#/self-drive?v=${v.id}">Book self-drive</a> `:''}<a class="btn sm alt" href="#/book?cat=${v.category}">Book with driver</a></div>`;
const R={
async '/'(){app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="hero-kicker">🚘 LOCAL RIDES · AIRPORT TRANSFERS · SELF-DRIVE</span><h1>Your journey, <b>made easy.</b></h1><p>Reliable rides and self-drive rentals across Bhilai, Durg and Raipur. Book in a few simple steps and travel with confidence.</p><div class="hero-actions"><a class="btn" href="#/book">Book a cab</a><a class="btn alt" href="#/self-drive">Explore self-drive</a></div><div class="trust-row"><span>✓ Clear booking process</span><span>✓ Vehicles for every trip</span><span>✓ Local travel support</span></div></div><form class="quick-search" id="qs"><span class="tag">PLAN YOUR RIDE</span><h2>Where are you going?</h2><p>Start with your pickup and drop-off locations.</p><label for="quick-pickup">Pickup location</label><input id="quick-pickup" placeholder="e.g. Bhilai, Sector 6" autocomplete="street-address" required><label for="quick-dropoff">Drop-off location</label><input id="quick-dropoff" placeholder="e.g. Raipur Airport" autocomplete="street-address" required><button class="btn">Find a ride <span aria-hidden="true">→</span></button><p class="field-note">You can review your trip details before confirming.</p></form></section><section aria-labelledby="vehicles-title"><div class="section-heading"><div><h2 id="vehicles-title">Choose your ride</h2><p>Comfortable options for everyday trips and longer journeys.</p></div><a href="#/fleet">View our fleet →</a></div><div id="v">${sk()}</div></section><section aria-labelledby="routes-title"><div class="section-heading"><div><h2 id="routes-title">Popular routes</h2><p>Plan a convenient trip to nearby destinations.</p></div><a href="#/routes">See routes & fares →</a></div><div id="r">${sk()}</div></section><section class="section-heading" style="margin-top:42px"><div><h2>Ready when you are</h2><p>Book online or send us an email to plan your next journey.</p></div>${CFG.email?`<a class="btn sm alt" href="${esc(mailtoUrl('Cab booking request','Hello Bhilai Travel Hub, I would like to book a cab.'))}">Email to book</a>`:''}</section>`;
 const bookLink=app.querySelector('.hero-actions .btn');bookLink.href='#/book';bookLink.textContent='Book a cab';
 $('#qs').onsubmit=(e)=>{e.preventDefault();const from=$('#quick-pickup').value.trim(),to=$('#quick-dropoff').value.trim();location.hash=`#/book?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`};
 const [v,r]=await Promise.all([api('/vehicles'),api('/routes')]);$('#v').innerHTML=`<div class="grid">${v.map(veh).join('')}</div>`;$('#r').innerHTML=`<div class="grid">${r.map(x=>`<a class="card" style="text-decoration:none;color:inherit" href="#/book?from=${encodeURIComponent(x.pickup)}&to=${encodeURIComponent(x.dropoff)}"><span class="tag">${esc(x.tag)}</span><h3>${esc(x.label)}</h3><p>${esc(x.duration)}</p></a>`).join('')}</div>`},
async '/book'(q){const min=new Date(Date.now()+36e5).toISOString().slice(0,16);
 app.innerHTML=`<section class="form-shell"><span class="tag">CAB BOOKING REQUEST</span><h1>Plan your ride</h1><p>Share your trip details by email. The travel desk will reply to confirm availability and fare.</p><form id="f" class="card request-card"><div class="row"><div><label for="p">Pickup location</label><input id="p" autocomplete="street-address" placeholder="e.g. Bhilai, Sector 6" required value="${esc(q.get('from')||'')}"></div><div><label for="d">Drop-off location</label><input id="d" autocomplete="street-address" placeholder="e.g. Raipur Airport" required value="${esc(q.get('to')||'')}"></div></div><div class="row"><div><label for="t">Pickup date &amp; time</label><input id="t" type="datetime-local" min="${min}" required></div><div><label for="tt">Trip type</label><select id="tt"><option value="One-way">One-way</option><option value="Round trip">Round trip</option><option value="Local rental">Local rental</option></select></div><div><label for="n">Passengers</label><input id="n" type="number" min="1" max="7" value="2" required></div><div><label for="l">Bags</label><input id="l" type="number" min="0" max="10" value="1"></div></div><div class="row"><div><label for="c">Vehicle preference</label><select id="c">${Object.entries(CAT).map(([k,v])=>`<option value="${v}" ${q.get('cat')===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="nm">Your name (optional)</label><input id="nm" autocomplete="name"></div><div><label for="ce">Your email (optional)</label><input id="ce" type="email" autocomplete="email"></div></div><label for="no">Additional instructions (optional)</label><textarea id="no" rows="2" placeholder="Luggage, stops, or anything else we should know"></textarea><p class="note msg">No account, SMS code or payment needed. This opens a draft in your email app; review it and tap Send. We’ll reply to the email address you provide.</p><button class="btn">Continue to email</button><div id="o"></div></form></section>`;
 $('#f').onsubmit=(e)=>{e.preventDefault();const text=['Hello Bhilai Travel Hub, I would like to request a cab booking.','',`Name: ${$('#nm').value.trim()||'Not provided'}`,`Reply email: ${$('#ce').value.trim()||'Not provided'}`,`Pickup: ${$('#p').value.trim()}`,`Drop-off: ${$('#d').value.trim()}`,`Date & time: ${new Date($('#t').value).toLocaleString()}`,`Trip type: ${$('#tt').value}`,`Passengers: ${$('#n').value}`,`Bags: ${$('#l').value||0}`,`Vehicle preference: ${$('#c').value}`,`Instructions: ${$('#no').value.trim()||'None'}`].join('\n');openEmailDraft($('#o'),'Cab booking request',text)}},
async '/self-drive'(q){app.innerHTML=`<h1>Self-drive car rental</h1><p>Choose a vehicle and send a request by email. We’ll confirm availability and rate with you. Valid Indian driving licence and Aadhaar required at handover.</p><div id="v">${sk()}</div>`;const v=await api('/vehicles?selfDrive=1');$('#v').innerHTML=`<div class="grid">${v.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${x.seats} seats • ${esc(x.transmission||'')}</p><p>${esc(x.notes||'')}</p><p><b>${x.daily_rate?'₹'+x.daily_rate+'/day':'Rate on request'}</b></p><button class="btn sm" data-id="${x.id}">Request by email</button></div>`).join('')}</div><div id="rf"></div>`;
 const open=(id)=>{const x=v.find(a=>a.id==id);if(!x)return;const t=new Date().toISOString().slice(0,10);$('#rf').innerHTML=`<form class="card request-card" style="margin-top:16px"><h3>Request ${esc(x.name)}</h3><div class="row"><div><label for="s">Pickup date</label><input id="s" type="date" min="${t}" required></div><div><label for="e">Return date</label><input id="e" type="date" min="${t}" required></div><div><label for="rn">Your name (optional)</label><input id="rn" autocomplete="name"></div><div><label for="re">Your email (optional)</label><input id="re" type="email" autocomplete="email"></div></div><p class="field-note">Availability, final pricing and handover details will be confirmed by email.</p><button class="btn">Continue to email</button><div id="o"></div></form>`;$('#rf').scrollIntoView({behavior:'smooth'});
  const start=$('#s'),end=$('#e');start.onchange=()=>{end.min=start.value;if(end.value&&end.value<start.value)end.value=start.value};
  $('#rf form').onsubmit=(e)=>{e.preventDefault();const text=['Hello Bhilai Travel Hub, I would like to request a self-drive rental.','',`Name: ${$('#rn').value.trim()||'Not provided'}`,`Reply email: ${$('#re').value.trim()||'Not provided'}`,`Vehicle: ${x.name}`,`Pickup date: ${$('#s').value}`,`Return date: ${$('#e').value}`].join('\n');openEmailDraft($('#o'),'Self-drive rental request',text)}};
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id));if(q.get('v'))open(q.get('v'))},
async '/fleet'(){app.innerHTML=`<h1>Our fleet</h1><label for="fc">Category</label><select id="fc" style="max-width:240px"><option value="">All</option>${Object.keys(CAT).map(k=>`<option>${k}</option>`).join('')}</select><div id="v" style="margin-top:16px">${sk()}</div>`;const go=async()=>{const v=await api('/vehicles'+($('#fc').value?'?category='+$('#fc').value:''));$('#v').innerHTML=`<div class="grid">${v.map(veh).join('')||'<p>No vehicles.</p>'}</div>`};$('#fc').onchange=go;go()},
async '/routes'(){app.innerHTML=`<h1>Popular routes & fares</h1><div id="r">${sk()}</div><p class="note msg">Indicative fares are shown only when configured. Final pricing depends on trip type, distance, vehicle, waiting time and applicable charges.</p>`;const r=await api('/routes');$('#r').innerHTML=`<div class="scroll"><table><tr><th>Route</th><th>Typical time</th><th>Fare</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(x.duration)}</td><td>${x.indicative_fare?'₹'+x.indicative_fare:'Metered tariff'}</td><td><a class="btn sm" href="#/book?from=${encodeURIComponent(x.pickup)}&to=${encodeURIComponent(x.dropoff)}">Book</a></td></tr>`).join('')}</table></div>`},
async '/policy'(){const c=CFG.cancellation;app.innerHTML=`<h1>Cancellation policy</h1><div class="grid"><div class="card"><h3>100% free</h3><p>Cancel at least ${c.freeHrs} hours before pickup.</p></div><div class="card"><h3>${c.midPct}% fee</h3><p>Between ${c.midHrs} and ${c.freeHrs} hours before pickup (policy states 20–50% depending on booking terms; this site applies ${c.midPct}%).</p></div><div class="card"><h3>${c.lowPct}% fee</h3><p>Less than ${c.midHrs} hours before pickup.</p></div></div><p>Eligible refunds, where any online payment was made, go to the original payment method subject to processing timelines. Please cancel as early as possible.</p>`},
async '/faq'(){app.innerHTML=`<h1>Frequently asked questions</h1>${[['What are the cancellation charges?','Free up to 6 hours before pickup; 20–50% between 2 and 6 hours; 80% under 2 hours.'],['How does self-drive rental work?','Share a valid Indian driving licence and Aadhaar. Vehicles are delivered in Bhilai/Durg subject to availability.'],['Are tolls and GST included?','The original site states fares are all-inclusive; please confirm with the desk when booking.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}`},
async '/contact'(){app.innerHTML=`<h1>Contact</h1><p><a class="btn" href="tel:${CFG.phone.replace(/\s/g,'')}">📞 ${esc(CFG.phone)}</a>${CFG.email?` <a class="btn alt" href="mailto:${esc(CFG.email)}">Email us</a>`:''}</p><form id="f" class="card"><label for="n">Name (optional)</label><input id="n" autocomplete="name"><label for="ce">Your email (optional)</label><input id="ce" type="email" autocomplete="email"><label for="g">Message</label><textarea id="g" rows="3" required></textarea><button class="btn" style="margin-top:12px">Continue to email</button><div id="o"></div></form>`;$('#f').onsubmit=(e)=>{e.preventDefault();openEmailDraft($('#o'),'Contact request',`Hello Bhilai Travel Hub, I have a question.\n\nName: ${$('#n').value.trim()||'Not provided'}\nReply email: ${$('#ce').value.trim()||'Not provided'}\nMessage: ${$('#g').value.trim()}`)}},
};
async function route(){const[h,qs]=(location.hash.slice(1)||'/').split('?');nav();$('#nav').classList.remove('open');$('#mb').setAttribute('aria-expanded','false');$('#mb').textContent='☰';
 try{if(R[h])await R[h](new URLSearchParams(qs||''));else app.innerHTML='<h1>Page not found</h1><p><a class="btn" href="#/">Go home</a></p>'}catch(e){msg(app,e.message,'err')}
 if(h!=='/self-drive')window.scrollTo(0,0);document.title=(h==='/'?'':h.slice(1).replace('-',' ')+' • ')+'Bhilai Travel Hub'}
addEventListener('hashchange',route);
(async()=>{try{CFG=await api('/config')}catch{}route()})();
</script></body></html>

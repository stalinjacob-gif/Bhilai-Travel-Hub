services:
  - type: web
    name: bhilai-travel-hub
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node --disable-warning=ExperimentalWarning server/index.js
    healthCheckPath: /
    disk:
      name: bth-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/bth.db
      - key: APP_SECRET
        generateValue: true
